<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코카콜라 가격비교</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f5f5f5}
header{background:#E3001B;color:white;padding:18px 20px 14px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
header h1{font-size:1.3rem;font-weight:800}
header p{font-size:0.75rem;opacity:0.85;margin-top:3px}
.search-box{background:white;padding:16px;border-bottom:1px solid #eee}
.search-box button{width:100%;background:#E3001B;color:white;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.search-box button:disabled{background:#ccc}
.info-bar{background:#fff8f8;border-left:3px solid #E3001B;margin:12px 16px;padding:10px 12px;font-size:0.78rem;color:#555;border-radius:0 6px 6px 0}
.loading{text-align:center;padding:40px 20px;color:#888}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#E3001B;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.results{padding:8px 16px 80px}
.result-count{font-size:0.8rem;color:#888;margin:8px 0 12px}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;align-items:center;gap:12px;cursor:pointer}
.rank{font-size:1.3rem;font-weight:900;color:#E3001B;min-width:28px;text-align:center}
.card-img{width:56px;height:56px;object-fit:contain;border-radius:6px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-title{font-size:0.82rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price-per{font-size:1.05rem;font-weight:800;color:#E3001B}
.price-unit{font-size:0.72rem;color:#888}
.price-total{font-size:0.78rem;color:#555;margin-top:2px}
.best-badge{background:#E3001B;color:white;font-size:0.7rem;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;margin-bottom:4px}
.error{background:#fff3f3;border:1px solid #ffcdd2;border-radius:10px;padding:16px;margin:16px;font-size:0.85rem;color:#c62828;text-align:center}
</style>
</head>
<body>
<header>
<h1>🥤 코카콜라 가격비교</h1>
<p>네이버 쇼핑 · 100ml당 최저가 순</p>
</header>
<div class="search-box">
<button id="btn" onclick="search()">🔍 지금 검색하기</button>
</div>
<div class="info-bar">
✅ 오리지널 코카콜라만 · 제로·라임·라벨프리 자동 제외<br>
✅ 100ml당 가격 자동 계산 후 저렴한 순 정렬
</div>
<div id="out"></div>
<script>
const EXCLUDE=['제로','라임','라벨프리','환타','스프라이트','zero','lime','레몬','오렌지','커피'];
function isOK(t){
  const l=t.toLowerCase();
  if(!l.includes('코카콜라')&&!l.includes('coca'))return false;
  return!EXCLUDE.some(w=>l.includes(w));
}
function getML(t){
  let m;
  m=t.match(/(\d+)\s*ml\s*[×x\*]\s*(\d+)/i);if(m)return+m[1]*+m[2];
  m=t.match(/(\d+(?:\.\d+)?)\s*[lL]\s*[×x\*]\s*(\d+)/);if(m)return+m[1]*1000*+m[2];
  m=t.match(/(\d+)\s*ml[^×x\*]*?(\d+)\s*개/i);if(m)return+m[1]*+m[2];
  m=t.match(/(\d+(?:\.\d+)?)\s*[lL][^×x\*]*?(\d+)\s*개/);if(m)return+m[1]*1000*+m[2];
  m=t.match(/(\d+)\s*ml/i);if(m){const c=t.match(/(\d+)\s*개/);return+m[1]*(c?+c[1]:1);}
  m=t.match(/(\d+(?:\.\d+)?)\s*[lL](?!\w)/);if(m){const c=t.match(/(\d+)\s*개/);return+m[1]*1000*(c?+c[1]:1);}
  return null;
}
async function search(){
  const btn=document.getElementById('btn');
  const out=document.getElementById('out');
  btn.disabled=true;btn.textContent='검색 중...';
  out.innerHTML='<div class="loading"><div class="spinner"></div>검색 중입니다...</div>';
  try{
    const queries=['코카콜라 CAN','코카콜라 PET','코카콜라 캔','코카콜라 페트'];
    let all=[];
    for(const q of queries){
      const r=await fetch('/api/naver?query='+encodeURIComponent(q));
      const d=await r.json();
      if(d.items)all=all.concat(d.items);
    }
    const seen=new Set();
    const results=[];
    for(const item of all){
      const title=item.title.replace(/<[^>]+>/g,'');
      const key=item.productId||item.link;
      if(seen.has(key)||!isOK(title))continue;
      seen.add(key);
      const price=+item.lprice;
      const ml=getML(title);
      if(!price||!ml||ml<200)continue;
      const per=Math.round(price/ml*100);
      if(per<30||per>600)continue;
      results.push({title,price,ml,per,image:item.image,link:item.link,mall:item.mallName});
    }
    results.sort((a,b)=>a.per-b.per);
    const top=results.slice(0,20);
    if(!top.length){out.innerHTML='<div class="error">검색 결과가 없습니다.</div>';return;}
    const emoji=['🥇','🥈','🥉'];
    let html='<div class="results"><div class="result-count">총 '+results.length+'개 중 TOP '+top.length+'</div>';
    top.forEach((item,i)=>{
      const L=(item.ml/1000).toFixed(2).replace(/\.?0+$/,'');
      html+=`<div class="card" onclick="window.open('${item.link}','_blank')">
        <div class="rank">${i<3?emoji[i]:i+1}</div>
        ${item.image?`<img class="card-img" src="${item.image}" onerror="this.style.display='none'">`:'<div style="width:56px;height:56px;background:#f0f0f0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0">🥤</div>'}
        <div class="card-info">
          ${i===0?'<span class="best-badge">✨ 최저가</span><br>':''}
          <div class="card-title">${item.title}</div>
          <div style="display:flex;align-items:baseline;gap:6px;margin-top:6px">
            <span class="price-per">${item.per.toLocaleString()}원</span>
            <span class="price-unit">/ 100ml</span>
          </div>
          <div class="price-total">총 ${item.price.toLocaleString()}원 · ${L}L · ${item.mall||''}</div>
        </div>
      </div>`;
    });
    out.innerHTML=html+'</div>';
  }catch(e){
    out.innerHTML='<div class="error">⚠️ 오류: '+e.message+'</div>';
  }
  btn.disabled=false;btn.textContent='🔍 다시 검색하기';
}
</script>
</body>
</html>
